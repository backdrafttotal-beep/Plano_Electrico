<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plano Almacen - Buscar referencia</title>
<style>
  :root{
    --bg:#14171c;
    --panel:#1c2129;
    --panel-2:#232a34;
    --line:#323a46;
    --amber:#e8a23d;
    --amber-dim:#7a5a26;
    --text:#eef1f5;
    --text-dim:#98a3b3;
    --red:#ff4d4d;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:14px;}

  header{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,#171b21,#14171c 90%);
    border-bottom:2px solid var(--amber-dim);
    padding:12px 16px 10px;
  }
  header h1{margin:0 0 2px;font-size:17px;letter-spacing:.3px;font-weight:700;}
  header .sub{font-size:11.5px;color:var(--text-dim);}

  .controls{
    display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;align-items:center;
  }
  #refInput{
    flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;color:var(--text);padding:11px 12px;font-size:15px;
    text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  #refInput:focus{outline:none;border-color:var(--amber);}
  .btn{border:none;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:700;
    display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-go{background:var(--amber);color:#241a06;}
  .btn-mic{background:#2a6f4f;color:#eafff2;font-size:18px;padding:11px 16px;}
  .btn-mic.listening{background:var(--red);animation:pulseMic 1s infinite;}
  @keyframes pulseMic{0%,100%{opacity:1;}50%{opacity:.6;}}
  .btn:active{transform:scale(.96);}
  .mic-note{font-size:11px;color:var(--text-dim);padding:0 12px 6px;}

  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--text);
    padding:10px 18px;border-radius:20px;font-size:13px;max-width:90vw;text-align:center;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #planoWrap{
    position:relative;width:100%;max-width:900px;margin:0 auto;
    background:#dedad2;
  }
  #planoWrap img{display:block;width:100%;height:auto;}
  .marker{
    position:absolute;width:34px;height:34px;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;
    border:3px solid var(--red);
    box-shadow:0 0 0 0 rgba(255,77,77,.7);
    animation:markerBlink 0.9s ease-in-out infinite;
    display:none;
  }
  .marker.show{display:block;}
  @keyframes markerBlink{
    0%{ box-shadow:0 0 0 0 rgba(255,77,77,.65); border-color:var(--red); background:rgba(255,77,77,.25);}
    50%{ box-shadow:0 0 0 14px rgba(255,77,77,0); border-color:#ffd24d; background:rgba(255,210,77,.35);}
    100%{ box-shadow:0 0 0 0 rgba(255,77,77,0); border-color:var(--red); background:rgba(255,77,77,.25);}
  }

  .found-list{padding:10px 12px 4px;font-size:12px;color:var(--text-dim);text-align:center;}
</style>
</head>
<body>

<header>
  <h1>Plano del almacen</h1>
  <div class="sub">Di o escribe una referencia para localizarla en el plano</div>
</header>

<div class="controls">
  <input type="text" id="refInput" placeholder="Ej: 489, 113, 091A..." autocomplete="off">
  <button class="btn btn-go" id="goBtn">Buscar</button>
  <button class="btn btn-mic" id="micBtn" title="Hablar">&#127908;</button>
</div>
<div class="mic-note" id="micNote">💡 Si el micrófono de arriba no funciona (es normal al abrir el archivo así), toca el buscador de texto y usa el micrófono de tu propio teclado para dictar la referencia.</div>
<div class="found-list" id="foundList"></div>

const REFS = [{"code": "687", "x": 560, "y": 120}, {"code": "191", "x": 560, "y": 157}, {"code": "425", "x": 565, "y": 197}, {"code": "351", "x": 565, "y": 232}, {"code": "721", "x": 555, "y": 265}, {"code": "741", "x": 552, "y": 300}, {"code": "688", "x": 177, "y": 367}, {"code": "192", "x": 207, "y": 365}, {"code": "426", "x": 257, "y": 365}, {"code": "352", "x": 307, "y": 365}, {"code": "722", "x": 357, "y": 365}, {"code": "741", "x": 415, "y": 365}, {"code": "531", "x": 195, "y": 500}, {"code": "146", "x": 245, "y": 500}, {"code": "852", "x": 295, "y": 500}, {"code": "790", "x": 340, "y": 500}, {"code": "789", "x": 380, "y": 500}, {"code": "851", "x": 415, "y": 500}, {"code": "114", "x": 440, "y": 470}, {"code": "113", "x": 460, "y": 497}, {"code": "155", "x": 545, "y": 450}, {"code": "811", "x": 590, "y": 465}, {"code": "177", "x": 625, "y": 465}, {"code": "178", "x": 655, "y": 437}, {"code": "812", "x": 715, "y": 460}, {"code": "265", "x": 755, "y": 448}, {"code": "489", "x": 810, "y": 535}, {"code": "490", "x": 810, "y": 572}, {"code": "277", "x": 805, "y": 610}, {"code": "420", "x": 805, "y": 648}, {"code": "419", "x": 805, "y": 685}, {"code": "398", "x": 810, "y": 718}, {"code": "397", "x": 810, "y": 752}, {"code": "115A", "x": 825, "y": 788}, {"code": "116A", "x": 825, "y": 822}, {"code": "483A", "x": 825, "y": 857}, {"code": "759", "x": 805, "y": 890}, {"code": "501", "x": 635, "y": 960}, {"code": "501", "x": 715, "y": 960}, {"code": "301", "x": 115, "y": 818}, {"code": "205", "x": 115, "y": 862}, {"code": "296", "x": 115, "y": 935}, {"code": "451", "x": 115, "y": 982}, {"code": "314", "x": 420, "y": 825}, {"code": "313", "x": 420, "y": 870}, {"code": "252", "x": 420, "y": 928}, {"code": "251", "x": 420, "y": 978}, {"code": "141", "x": 185, "y": 1060}, {"code": "091A", "x": 245, "y": 1060}, {"code": "092A", "x": 310, "y": 1060}, {"code": "429", "x": 350, "y": 1060}, {"code": "430", "x": 380, "y": 1060}];

const planoWrap = document.getElementById("planoWrap");
const planoImg = document.getElementById("planoImg");
const refInput = document.getElementById("refInput");
const goBtn = document.getElementById("goBtn");
const micBtn = document.getElementById("micBtn");
const micNote = document.getElementById("micNote");
const foundListEl = document.getElementById("foundList");
const IMG_W = 896, IMG_H = 1195;

// ---------- Crear marcadores (uno por cada referencia del plano) ----------
const markerEls = REFS.map(r=>{
  const el = document.createElement("div");
  el.className = "marker";
  el.style.left = (r.x / IMG_W * 100) + "%";
  el.style.top = (r.y / IMG_H * 100) + "%";
  planoWrap.appendChild(el);
  return el;
});

function clearMarkers(){
  markerEls.forEach(el=> el.classList.remove("show"));
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove("show"), 2600);
}

// ---------- Buscar una referencia y marcarla ----------
function normalize(s){
  return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function findRef(raw){
  const target = normalize(raw);
  if(!target) return [];
  const idxs = [];
  REFS.forEach((r,i)=>{
    if(normalize(r.code) === target) idxs.push(i);
  });
  return idxs;
}

function goToRef(raw){
  clearMarkers();
  let idxs = findRef(raw);
  if(idxs.length === 0){
    // probamos a interpretar el texto como un numero escrito con palabras
    // (por ejemplo "cuatro ochenta y nueve" o lo que dicte el micro del teclado)
    const parsed = parseSpokenReference(raw);
    if(parsed) idxs = findRef(parsed);
  }
  if(idxs.length === 0){
    foundListEl.textContent = "";
    showToast('No se ha encontrado la referencia "' + raw + '"');
    return;
  }
  idxs.forEach(i=> markerEls[i].classList.add("show"));
  const first = markerEls[idxs[0]];
  try{ first.scrollIntoView({ behavior:"smooth", block:"center" }); }catch(e){}
  foundListEl.textContent = idxs.length > 1
    ? `Marcadas ${idxs.length} coincidencias de "${REFS[idxs[0]].code}"`
    : `Marcada la referencia "${REFS[idxs[0]].code}"`;
}

goBtn.addEventListener("click", ()=>{
  if(refInput.value.trim()) goToRef(refInput.value);
});
refInput.addEventListener("keydown", e=>{
  if(e.key === "Enter" && refInput.value.trim()) goToRef(refInput.value);
});

// ---------- Reconocimiento de voz (numeros en espanol -> digitos) ----------
const WORD_NUM = {
  "cero":0,"uno":1,"una":1,"dos":2,"tres":3,"cuatro":4,"cinco":5,"seis":6,"siete":7,"ocho":8,"nueve":9,
  "diez":10,"once":11,"doce":12,"trece":13,"catorce":14,"quince":15,
  "dieciseis":16,"diecisiete":17,"dieciocho":18,"diecinueve":19,
  "veinte":20,"treinta":30,"cuarenta":40,"cincuenta":50,"sesenta":60,"setenta":70,"ochenta":80,"noventa":90,
  "cien":100,"ciento":100,"doscientos":200,"trescientos":300,"cuatrocientos":400,"quinientos":500,
  "seiscientos":600,"setecientos":700,"ochocientos":800,"novecientos":900
};

function parseSpokenReference(transcript){
  const tokens = transcript
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "") // quitar tildes
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/)
    .filter(Boolean);

  const groups = [];
  let current = null;
  let pendingY = false;

  tokens.forEach(tok=>{
    if(tok === "y"){ pendingY = true; return; }

    let val = null;
    if(/^\d+$/.test(tok)) val = parseInt(tok, 10);
    else if(tok in WORD_NUM) val = WORD_NUM[tok];

    if(val !== null){
      const canAdd = current !== null && (pendingY || (current >= 100 && current % 100 === 0));
      if(canAdd){ current += val; }
      else{ if(current !== null) groups.push(String(current)); current = val; }
      pendingY = false;
      return;
    }

    if(/^[a-e]$/.test(tok)){
      if(current !== null){ groups.push(String(current)); current = null; }
      groups.push(tok.toUpperCase());
      pendingY = false;
      return;
    }

    // palabra no reconocida: cerramos el grupo actual
    if(current !== null){ groups.push(String(current)); current = null; }
    pendingY = false;
  });
  if(current !== null) groups.push(String(current));

  return groups.join("");
}

let recognition = null;
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognitionCtor){
  recognition = new SpeechRecognitionCtor();
  recognition.lang = "es-ES";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.addEventListener("start", ()=>{
    micBtn.classList.add("listening");
    showToast("Escuchando... di la referencia");
  });
  recognition.addEventListener("end", ()=>{
    micBtn.classList.remove("listening");
  });
  recognition.addEventListener("error", (e)=>{
    micBtn.classList.remove("listening");
    showToast("Este micrófono no funciona así (archivo local) · usa el de tu teclado, ya está listo abajo");
    refInput.focus();
  });
  recognition.addEventListener("result", (e)=>{
    const transcript = e.results[0][0].transcript;
    refInput.value = transcript;
    const parsed = parseSpokenReference(transcript);
    // probamos primero con el numero interpretado; si no hay match, probamos el texto tal cual
    let idxs = findRef(parsed);
    if(idxs.length === 0) idxs = findRef(transcript);
    if(idxs.length === 0){
      showToast('He entendido "' + transcript + '" pero no encuentro esa referencia');
      foundListEl.textContent = "";
      clearMarkers();
    }else{
      refInput.value = REFS[idxs[0]].code;
      clearMarkers();
      idxs.forEach(i=> markerEls[i].classList.add("show"));
      try{ markerEls[idxs[0]].scrollIntoView({ behavior:"smooth", block:"center" }); }catch(e){}
      foundListEl.textContent = idxs.length > 1
        ? `Marcadas ${idxs.length} coincidencias de "${REFS[idxs[0]].code}"`
        : `Marcada la referencia "${REFS[idxs[0]].code}"`;
    }
  });

  micBtn.addEventListener("click", ()=>{
    try{ recognition.start(); }
    catch(e){ /* ya estaba escuchando */ }
  });
}else{
  micBtn.style.display = "none";
  micNote.textContent = "El microfono por voz no esta disponible en este navegador: usa el buscador de texto de arriba.";
}
</script>
</body>
</html>
